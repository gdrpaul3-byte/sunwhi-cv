# Edit this file, then run:  python scripts/build.py
# Validate without building: python scripts/build.py --check
# Run the guard tests:       python scripts/test_build.py
#
# Fields ending _en / _kr are language pairs. English outputs prefer _en and
# fall back to _kr; the Korean 이력서 does the reverse.
#
# Author-name style: Vancouver (no hyphens in initials) — "Choi JS", not
# "Choi J-S" — applied consistently even where a publisher prints otherwise.
#
# Provenance: every entry below was verified in Aug 2026 against publisher
# PDFs, Crossref/DataCite, the live ORCID record, the arXiv API, official
# Korea University certificates, and HSMU administrative documents. Entries
# that could not be verified were left out rather than guessed; see the
# `open_questions` block at the end of this file.
# ---------------------------------------------------------------------------

meta:
  updated: "2026-08-25"
  author_note_en: >-
    Published under both “Kim” and “Kimm”. Each work is listed under the surname used
    in the original publication. * equal contribution; † corresponding author.
  resume:
    max_publications: 6
    summary_en: >-
      Behavioural neuroscientist working at the junction of neural-circuit biology and
      human–AI interaction. Circuit-specific dissection of social and defensive behaviour
      in mouse models of autism (Cell Reports cover article; Nature Communications),
      now extended to large-scale human experiments on how people judge AI-generated
      media. Currently Department Chair of Bio-Healthcare at Hwasung Medi-Science
      University, where I built the department's experimental teaching programme.
      Alongside the research, I lecture and advise on AI-agent adoption for companies
      and institutions, and build agent-driven automation for university operations.

