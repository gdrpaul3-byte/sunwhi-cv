name: Build CV

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Monthly nudge: rebuilds and re-runs the ORCID reconciliation so drift
    # between cv.yaml and the live ORCID record shows up in the job summary.
    - cron: "0 3 1 * *"

permissions:
  contents: read      # nothing is pushed back; build/ is committed by hand
  pages: write
  id-token: write

concurrency:
  group: cv-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate cv.yaml
        run: python scripts/build.py --check

      - name: Build artifacts
        run: python scripts/build.py --docx --orcid-diff

      # Runs after the build so the privacy-leak check has files to inspect.
      # private.yaml is never in CI, so that check is a no-op here — it is the
      # local pre-commit guard. Everything else is enforced on every push.
      - name: Tests
        run: python scripts/test_build.py

      - name: Export PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium-browser || sudo snap install chromium
          python scripts/build.py --pdf
        continue-on-error: true

      - name: ORCID drift summary
        run: |
          if [ -f build/orcid-diff.json ]; then
            {
              echo "### ORCID reconciliation"
              echo ''
              python - <<'PY'
          import json
          d = json.load(open('build/orcid-diff.json', encoding='utf-8'))
          mw = d.get('missing_works') or []
          if mw:
              print('**%d work(s) in cv.yaml are missing from ORCID:**\n' % len(mw))
              for w in mw:
                  print('- %s (`%s`)' % (w['title'], w['doi']))
          else:
              print('All cv.yaml works with a DOI are present in ORCID.')
          for e in d.get('open_ended_education') or []:
              print('\n- :warning: education **%s** at %s has no end date' % (e['role'], e['org']))
          print('\n| section | ORCID | cv.yaml |')
          print('|---|---|---|')
          c = d.get('counts') or {}
          for k in ('education', 'employment', 'fundings', 'distinctions', 'services'):
              orc = c.get('orcid_' + k)
              mine = c.get('cv_' + {'education':'education','employment':'appointments',
                                    'fundings':'grants_awarded','distinctions':'awards',
                                    'services':'service'}[k])
              print('| %s | %s | %s |' % (k, orc, mine))
          PY
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        continue-on-error: true

      # CI deliberately does NOT commit build/. Pages is deployed from the
      # files this job just built, and the committed copy comes from whoever
      # edited cv.yaml. Having both write build/ meant every local push
      # conflicted on the generated .docx and .pdf binaries.
      #
      # Instead, fail loudly if the committed build/ is stale, so the tree
      # never claims to be something it isn't.
      - name: Committed build/ matches cv.yaml
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- build/cv-en.md build/cv-kr.md build/resume-en.md \
                                 build/index.html build/cv.json build/publications.json; then
            echo "committed build/ is up to date"
          else
            echo "::error::build/ is stale — run 'python scripts/build.py' and commit the result"
            git diff --stat -- build/
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cv
          path: build/

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: build/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
